services:
  postgres:
    # pgvector on Postgres 16: vectors and full-text in one service (SPEC §7)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: genius
      POSTGRES_PASSWORD: genius
      POSTGRES_DB: genius
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genius -d genius"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
